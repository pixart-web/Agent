name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  # Manual runs for stacked branches (e.g. the desktop branch before it targets main).
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    env:
      APP_ENV: test
      AUTH_SECRET_KEY: test-only-auth-secret-with-at-least-32-characters
      AUTH_RATE_LIMIT_ENABLED: 'false'
      AI_PROVIDER: fake
      AI_LOCAL_MODEL: fake-supervisor-v1
      GITHUB_INTEGRATION_ENABLED: 'false'
      CODEX_INTEGRATION_ENABLED: 'false'
      EMAIL_INTEGRATION_ENABLED: 'false'
      CALENDAR_INTEGRATION_ENABLED: 'false'

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: apps/api/pyproject.toml

      - name: Install backend dependencies
        run: python -m pip install -e "apps/api[dev]"

      - name: Run Ruff
        run: |
          python -m ruff check apps/api
          python -m ruff format --check apps/api

      - name: Validate Alembic offline
        working-directory: apps/api
        run: |
          python -m alembic downgrade 20261010_0021:20261010_0020 --sql > /dev/null
          python -m alembic downgrade 20261010_0020:20261010_0019 --sql > /dev/null
          python -m alembic downgrade 20261010_0019:20261010_0018 --sql > /dev/null
          python -m alembic downgrade 20261010_0018:20261010_0017 --sql > /dev/null
          python -m alembic downgrade 20261010_0017:20261010_0016 --sql > /dev/null
          python -m alembic downgrade 20261010_0016:20260920_0015 --sql > /dev/null
          python -m alembic downgrade 20260920_0015:20260920_0014 --sql > /dev/null
          python -m alembic downgrade 20260920_0014:20260919_0013 --sql > /dev/null
          python -m alembic downgrade 20260919_0013:20260919_0012 --sql > /dev/null
          python -m alembic downgrade 20260919_0012:20260919_0011 --sql > /dev/null
          python -m alembic downgrade 20260919_0011:20260919_0010 --sql > /dev/null
          python -m alembic downgrade 20260919_0010:20260823_0009 --sql > /dev/null
          python -m alembic downgrade 20260823_0009:20260823_0008 --sql > /dev/null
          python -m alembic downgrade 20260823_0008:20260821_0007 --sql > /dev/null
          python -m alembic downgrade 20260821_0007:20260818_0006 --sql > /dev/null
          python -m alembic upgrade head --sql > /dev/null
          python -m alembic downgrade 20260818_0006:20260818_0005 --sql > /dev/null

      - name: Run policy quality evaluations
        run: python -m app.scripts.run_policy_evaluations

      - name: Run Pytest
        run: python -m pytest apps/api

  integration:
    name: PostgreSQL and Redis integration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: agent
          POSTGRES_USER: agent
          POSTGRES_PASSWORD: agent
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U agent -d agent"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      APP_ENV: test
      AUTH_SECRET_KEY: test-only-auth-secret-with-at-least-32-characters
      DATABASE_URL: postgresql+psycopg://agent:agent@localhost:5432/agent
      INTEGRATION_DATABASE_URL: postgresql+psycopg://agent:agent@localhost:5432/agent
      INTEGRATION_REDIS_URL: redis://localhost:6379/1
      AI_PROVIDER: fake
      AI_LOCAL_MODEL: fake-supervisor-v1
      GITHUB_INTEGRATION_ENABLED: 'false'
      CODEX_INTEGRATION_ENABLED: 'false'
      EMAIL_INTEGRATION_ENABLED: 'false'
      CALENDAR_INTEGRATION_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: apps/api/pyproject.toml
      - run: python -m pip install -e "apps/api[dev]"
      - name: Validate real migrations
        working-directory: apps/api
        run: |
          python -m alembic upgrade head
          python -m alembic downgrade 20261010_0020
          python -m alembic upgrade head
      - name: Models match the migrated schema
        working-directory: apps/api
        run: python -m alembic check
      - name: Test locking, outbox, and Redis
        run: python -m pytest apps/api/tests/test_execution_integration.py -m integration
      - name: Create a disposable database for the full suite
        run: |
          python - <<'PY'
          import psycopg
          with psycopg.connect("postgresql://agent:agent@localhost:5432/agent", autocommit=True) as conn:
              conn.execute("CREATE DATABASE agent_pytest_test")
          PY
      - name: Full backend suite on PostgreSQL 16 (foreign keys, enums, full-text search)
        env:
          TEST_DATABASE_URL: postgresql+psycopg://agent:agent@localhost:5432/agent_pytest_test
          AUTH_RATE_LIMIT_ENABLED: 'false'
        run: python -m pytest apps/api

  frontend:
    name: Frontend
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Enable pnpm with Corepack
        run: |
          corepack enable
          corepack prepare pnpm@11.9.0 --activate

      - name: Locate pnpm store
        id: pnpm-store
        shell: bash
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        uses: actions/cache@v5
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm format:check

      - name: Run ESLint
        run: pnpm lint

      - name: Run TypeScript checks
        run: pnpm typecheck

      - name: Run frontend tests
        run: pnpm test

      - name: Build Next.js
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000
        run: pnpm build

  quality-sweep:
    name: Accessibility and quality sweep (every dashboard screen)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: agent
          POSTGRES_USER: agent
          POSTGRES_PASSWORD: agent
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U agent -d agent"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports:
          - 6379:6379
      mailpit:
        image: axllent/mailpit:v1.29
        ports:
          - 1025:1025
          - 8025:8025
    env:
      APP_ENV: test
      AUTH_SECRET_KEY: test-only-auth-secret-with-at-least-32-characters
      AUTH_COOKIE_SECURE: 'false'
      AUTH_REQUIRE_EMAIL_VERIFICATION: 'true'
      AUTH_RATE_LIMIT_ENABLED: 'false'
      DATABASE_URL: postgresql+psycopg://agent:agent@localhost:5432/agent
      REDIS_URL: redis://localhost:6379/0
      CELERY_BROKER_URL: redis://localhost:6379/1
      WEB_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
      TRUSTED_HOSTS: localhost,127.0.0.1
      PUBLIC_WEB_URL: http://localhost:3000
      TRANSACTIONAL_EMAIL_ENABLED: 'true'
      TRANSACTIONAL_EMAIL_FROM: kiko-ci@example.com
      SMTP_HOST: localhost
      SMTP_PORT: '1025'
      SMTP_STARTTLS: 'false'
      AI_PROVIDER: fake
      AI_LOCAL_MODEL: fake-supervisor-v1
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: apps/api/pyproject.toml
      - run: python -m pip install -e "apps/api[dev]"
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Enable pnpm with Corepack
        run: |
          corepack enable
          corepack prepare pnpm@11.9.0 --activate
      - run: pnpm install --frozen-lockfile
      - name: Migrate and seed
        working-directory: apps/api
        run: |
          python -m alembic upgrade head
          python -m app.scripts.seed_agents
      - name: Start the API and the email dispatcher
        working-directory: apps/api
        run: |
          nohup python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 > /tmp/api.log 2>&1 &
          nohup python -m app.scripts.run_transactional_email_dispatcher > /tmp/mailer.log 2>&1 &
          for i in $(seq 1 60); do curl -fsS http://127.0.0.1:8000/health && break; sleep 1; done
      # The production web build calls the API on its own origin (behind the reverse proxy),
      # so the sweep uses the development server, which calls NEXT_PUBLIC_API_URL. Every route
      # is requested once first so on-demand compilation cannot exceed the test timeouts.
      - name: Start the web client and compile every route
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000
        working-directory: apps/web
        run: |
          nohup pnpm exec next dev -p 3000 > /tmp/web.log 2>&1 &
          for i in $(seq 1 90); do curl -fsS http://localhost:3000/login > /dev/null && break; sleep 1; done
          for route in /login /onboarding /dashboard /dashboard/kiko /dashboard/commands \
            /dashboard/commands/new /dashboard/tasks /dashboard/projects /dashboard/executions \
            /dashboard/analytics /dashboard/agents /dashboard/automations /dashboard/knowledge \
            /dashboard/approvals /dashboard/notifications /dashboard/codex /dashboard/email \
            /dashboard/calendar /dashboard/crm /dashboard/marketing /dashboard/integrations \
            /dashboard/settings /dashboard/subscription; do
            curl -fsS -o /dev/null "http://localhost:3000$route" || echo "warm-up failed: $route"
          done
      - name: Install Chromium for Playwright
        working-directory: apps/web
        run: pnpm exec playwright install --with-deps chromium
      - name: Quality sweep (page errors, API 5xx, overflow, axe WCAG 2 A/AA serious/critical)
        working-directory: apps/web
        env:
          E2E_WEB_URL: http://localhost:3000
          E2E_API_URL: http://localhost:8000
          E2E_MAILPIT_URL: http://localhost:8025
        run: pnpm exec playwright test e2e/dashboard-quality-sweep.spec.ts --reporter=line
      - name: Service logs
        if: failure()
        run: tail -n 80 /tmp/api.log /tmp/mailer.log /tmp/web.log

  desktop:
    name: Desktop (macOS)
    runs-on: macos-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Enable pnpm with Corepack
        run: |
          corepack enable
          corepack prepare pnpm@11.9.0 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Set up Rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable

      - name: Cache Cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            apps/desktop/src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('apps/desktop/src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Build desktop UI (static export)
        run: pnpm --filter @agent/desktop run build:ui

      - name: Rust format
        working-directory: apps/desktop/src-tauri
        run: cargo fmt --check

      - name: Clippy
        working-directory: apps/desktop/src-tauri
        run: cargo clippy --all-targets -- -D warnings

      - name: Rust tests
        working-directory: apps/desktop/src-tauri
        run: cargo test

      - name: Build unsigned .app and .dmg
        env:
          CI: 'true'
        working-directory: apps/desktop
        run: pnpm tauri build --bundles app,dmg

      - name: Verify bundle
        run: |
          APP=apps/desktop/src-tauri/target/release/bundle/macos/Kiko.app
          codesign --verify --deep --strict "$APP"
          /usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$APP/Contents/Info.plist"
          test "$(codesign -d --entitlements - --xml "$APP" 2>/dev/null | grep -c '<key>')" -eq 1

      - name: Upload unsigned development build
        uses: actions/upload-artifact@v4
        with:
          name: kiko-macos-unsigned-${{ github.sha }}
          path: apps/desktop/src-tauri/target/release/bundle/dmg/*.dmg
          retention-days: 14

  containers:
    name: Production container build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Build API image
        run: docker build --file apps/api/Dockerfile --tag kiko-api:ci .
      - name: Build Web image
        run: >-
          docker build --file apps/web/Dockerfile.production
          --build-arg NEXT_PUBLIC_API_URL=http://localhost:8000
          --tag kiko-web:ci .
