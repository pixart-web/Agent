name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    env:
      APP_ENV: test
      AUTH_SECRET_KEY: test-only-auth-secret-with-at-least-32-characters
      AUTH_RATE_LIMIT_ENABLED: 'false'
      AI_PROVIDER: fake
      OPENAI_MODEL: fake-supervisor-v1
      GITHUB_INTEGRATION_ENABLED: 'false'
      CODEX_INTEGRATION_ENABLED: 'false'
      EMAIL_INTEGRATION_ENABLED: 'false'

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: apps/api/pyproject.toml

      - name: Install backend dependencies
        run: python -m pip install -e "apps/api[dev]"

      - name: Run Ruff
        run: |
          python -m ruff check apps/api
          python -m ruff format --check apps/api

      - name: Validate Alembic offline
        working-directory: apps/api
        run: |
          python -m alembic downgrade 20260823_0008:20260821_0007 --sql > /dev/null
          python -m alembic downgrade 20260821_0007:20260818_0006 --sql > /dev/null
          python -m alembic upgrade head --sql > /dev/null
          python -m alembic downgrade 20260818_0006:20260818_0005 --sql > /dev/null

      - name: Run Pytest
        run: python -m pytest apps/api

  integration:
    name: PostgreSQL and Redis integration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: agent
          POSTGRES_USER: agent
          POSTGRES_PASSWORD: agent
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U agent -d agent"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      APP_ENV: test
      AUTH_SECRET_KEY: test-only-auth-secret-with-at-least-32-characters
      DATABASE_URL: postgresql+psycopg://agent:agent@localhost:5432/agent
      INTEGRATION_DATABASE_URL: postgresql+psycopg://agent:agent@localhost:5432/agent
      INTEGRATION_REDIS_URL: redis://localhost:6379/1
      AI_PROVIDER: fake
      OPENAI_MODEL: fake-supervisor-v1
      GITHUB_INTEGRATION_ENABLED: 'false'
      CODEX_INTEGRATION_ENABLED: 'false'
      EMAIL_INTEGRATION_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: apps/api/pyproject.toml
      - run: python -m pip install -e "apps/api[dev]"
      - name: Apply real migrations
        working-directory: apps/api
        run: python -m alembic upgrade head
      - name: Test locking, outbox, and Redis
        run: python -m pytest apps/api/tests/test_execution_integration.py -m integration

  frontend:
    name: Frontend
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Enable pnpm with Corepack
        run: |
          corepack enable
          corepack prepare pnpm@11.9.0 --activate

      - name: Locate pnpm store
        id: pnpm-store
        shell: bash
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        uses: actions/cache@v5
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm format:check

      - name: Run ESLint
        run: pnpm lint

      - name: Run TypeScript checks
        run: pnpm typecheck

      - name: Run frontend tests
        run: pnpm test

      - name: Build Next.js
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000
        run: pnpm build
