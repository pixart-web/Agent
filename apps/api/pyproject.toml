[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-api"
version = "0.1.0"
description = "API for the Pixart Agent operating system"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.14,<2.0",
  "celery[redis]>=5.4,<6.0",
  "cryptography>=50.0.2,<51",
  "argon2-cffi>=23.1,<26.0",
  "email-validator>=2.2,<3.0",
  "fastapi>=0.143.1,<0.144",
  "httpx>=0.28.1,<0.29",
  "openai>=2.8,<3.0",
  "PyJWT>=2.9,<3.0",
  "pypdf>=6.1,<7.0",
  "psycopg[binary]>=3.2,<4.0",
  "pydantic-settings>=2.6,<3.0",
  "python-multipart>=0.0.20,<1.0",
  "python-docx>=1.2,<2.0",
  "redis>=5.2,<6.0",
  "sqlalchemy>=2.0.36,<2.1",
  "starlette>=1.8,<1.9",
  "uvicorn[standard]>=0.32,<1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=9.1.1,<10.0",
  "ruff>=0.8,<1.0",
]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["."]
markers = ["integration: requires PostgreSQL and Redis services"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.setuptools.packages.find]
include = ["app*"]
